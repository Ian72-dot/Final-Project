<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    overflow:hidden;
}

h1{
    margin:10px 0;
}

#score{
    font-size:24px;
    margin-bottom:10px;
}

canvas{
    background:black;
    border:2px solid white;
    width:min(90vw, 400px);
    height:min(90vw, 400px);
}

.controls{
    margin-top:15px;
    display:grid;
    grid-template-columns:80px 80px 80px;
    gap:10px;
}

.controls button{
    font-size:28px;
    height:65px;
    border:none;
    border-radius:12px;
    background:#333;
    color:white;
}

.controls button:active{
    background:#666;
}
</style>
</head>
<body>

<h1>🐍 Snake</h1>
<div id="score">Score: 0</div>

<canvas id="game" width="400" height="400"></canvas>

<div class="controls">
    <div></div>
    <button onclick="changeDir(0,-1)">⬆️</button>
    <div></div>

    <button onclick="changeDir(-1,0)">⬅️</button>
    <button onclick="changeDir(0,1)">⬇️</button>
    <button onclick="changeDir(1,0)">➡️</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const grid = 20;
const tile = canvas.width / grid;

let snake = [{x:10,y:10}];
let dx = 1;
let dy = 0;
let score = 0;

let food = randomFood();

function randomFood(){
    return {
        x: Math.floor(Math.random()*grid),
        y: Math.floor(Math.random()*grid)
    };
}

function changeDir(x,y){
    if(x === -dx && y === -dy) return;
    dx = x;
    dy = y;
}

document.addEventListener("keydown", e=>{
    if(e.key==="ArrowUp") changeDir(0,-1);
    if(e.key==="ArrowDown") changeDir(0,1);
    if(e.key==="ArrowLeft") changeDir(-1,0);
    if(e.key==="ArrowRight") changeDir(1,0);
});

function update(){
    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    if(
        head.x < 0 ||
        head.y < 0 ||
        head.x >= grid ||
        head.y >= grid ||
        snake.some(seg => seg.x === head.x && seg.y === head.y)
    ){
        alert("Game Over! Score: " + score);

        snake = [{x:10,y:10}];
        dx = 1;
        dy = 0;
        score = 0;
        food = randomFood();
        return;
    }

    snake.unshift(head);

    if(head.x === food.x && head.y === food.y){
        score++;
        food = randomFood();
    } else {
        snake.pop();
    }

    draw();
}

function draw(){
    ctx.fillStyle = "black";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "red";
    ctx.fillRect(food.x*tile, food.y*tile, tile, tile);

    ctx.fillStyle = "lime";
    snake.forEach(part=>{
        ctx.fillRect(part.x*tile, part.y*tile, tile-1, tile-1);
    });

    document.getElementById("score").textContent =
        "Score: " + score;
}

draw();
setInterval(update, 120);
</script>

</body>
</html>
