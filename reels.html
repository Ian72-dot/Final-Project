<!DOCTYPE html>
<html>
<head>
  <title>Reels</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 200px;
      height: 100vh;
      background: #222;
      padding-top: 20px;
    }

    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 15px 20px;
      font-size: 18px;
    }

    .sidebar a:hover {
      background: #444;
    }

    /* Reels */
    .reels-container {
      margin-left: 220px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    video {
      width: 360px;
      height: 640px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      background: #000;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <a href="posts.html">Posts</a>
    <a href="reels.html">Reels</a>
    <a href="podcast.html">Podcast</a>
  </div>

  <!-- Reels -->
  <div class="reels-container">

    <!-- First Video -->
    <video controls>
      <source src="Reel1.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <!-- Second Video -->
    <video controls>
      <source src="reel2.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

  </div>

</body>
</html>
